server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml image/webp image/png image/jpeg;

    location = /home {
        return 301 /;
    }

    rewrite ^/(explore|courses|parents|terms)/$ /$1 permanent;

    location = / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(explore|courses|parents|terms)/?$ {
        try_files $uri $uri/ =404;
    }

    location ~ ^/(login|register|google-onboarding|diary|parents/articles/.*|zone(?:/.*)?)$ {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.(webp|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}

server
{
    listen 80;
    listen 443 ssl http2;
    server_name cms.ottopia.vn;

    client_max_body_size 500M;

    # CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/cms.ottopia.vn.conf;
    # CERT-APPLY-CHECK--ENC

    # SSL-START
    ssl_certificate    /www/server/panel/vhost/cert/cms.ottopia.vn/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/cms.ottopia.vn/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497 https://$host$request_uri;
    #SSL-ENC

    location ~ \.well-known {
        allow all;
    }

    # Proxy all requests to backend container on port 5000
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        client_max_body_size 500M;
    }

    access_log  /www/wwwlogs/cms.ottopia.vn.log;
    error_log   /www/wwwlogs/cms.ottopia.vn.error.log;
}

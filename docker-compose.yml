services:
  db:
    image: postgres:16-alpine
    container_name: kiddo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kiddo
      POSTGRES_PASSWORD: kiddo_password
      POSTGRES_DB: kiddo_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiddo -d kiddo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: kiddo_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kiddo:kiddo_password@db:5432/kiddo_db
      JWT_ACCESS_SECRET: ottopia-kiddo-access-secret-dev-2024
      JWT_REFRESH_SECRET: ottopia-kiddo-refresh-secret-dev-2024
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: 5000
      NODE_ENV: development
      CLIENT_URL: http://localhost:5180
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GA4_PROPERTY_ID: ${GA4_PROPERTY_ID:-}
      GA4_CLIENT_EMAIL: ${GA4_CLIENT_EMAIL:-}
      GA4_PRIVATE_KEY: ${GA4_PRIVATE_KEY:-}
      GA4_MOCK: ${GA4_MOCK:-true}
    ports:
      - "5000:5000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kiddo_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "5180:5180"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro

  cms:
    build:
      context: ./backend/cms
      dockerfile: Dockerfile
      target: development
    container_name: kiddo_cms
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_API_URL: http://backend:5000
    ports:
      - "5173:5173"
    volumes:
      - ./backend/cms/src:/app/src
      - ./backend/cms/public:/app/public
      - ./backend/cms/index.html:/app/index.html
      - ./backend/cms/vite.config.ts:/app/vite.config.ts:ro

volumes:
  postgres_data:

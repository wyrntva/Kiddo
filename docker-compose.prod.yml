services:
  db:
    image: postgres:16-alpine
    container_name: kiddo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kiddo
      POSTGRES_PASSWORD: kiddo_password
      POSTGRES_DB: kiddo_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiddo -d kiddo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kiddo_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kiddo:kiddo_password@db:5432/kiddo_db
      JWT_ACCESS_SECRET: ottopia-kiddo-access-secret-prod-2024
      JWT_REFRESH_SECRET: ottopia-kiddo-refresh-secret-prod-2024
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://ottopia.vn
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: kiddo_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:

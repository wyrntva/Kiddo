services:
  db:
    image: postgres:16-alpine
    container_name: kiddo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kiddo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: kiddo_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiddo -d kiddo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kiddo_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kiddo:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/kiddo_db
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: ${CLIENT_URL:-https://ottopia.vn}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GA4_PROPERTY_ID: ${GA4_PROPERTY_ID:-}
      GA4_CLIENT_EMAIL: ${GA4_CLIENT_EMAIL:-}
      GA4_PRIVATE_KEY: ${GA4_PRIVATE_KEY:-}
      GA4_MOCK: ${GA4_MOCK:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      FACEBOOK_VERIFY_TOKEN: ${FACEBOOK_VERIFY_TOKEN:-}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${FACEBOOK_PAGE_ACCESS_TOKEN:-}
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-https://ottopia.vn}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    container_name: kiddo_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3080:80"

volumes:
  postgres_data:
    external: true
    name: kiddo_postgres_data
  backend_uploads:
    external: true
    name: kiddo_backend_uploads
